function intro(){return `<section class="scene scene-hero grow-${state.n}"><div class="hero-tag">의정부툰의 지원금 안내</div><h1 class="title hero-title">내가 받을 수 있는<br><strong>지원금 찾기!</strong></h1><p class="sub">몰라서 놓친 혜택이 있다면?<br>의정이가 내 조건에 맞는 지원사업을 찾아드릴게요.</p><div class="mascot-stage"><div class="talk">내 지원금도<br>있으려나?</div>${pose('point')}<span class="hero-spark">✦</span><span class="hero-spark right">✦</span></div><p class="reaction" id="reaction">${state.n?react[Math.min(4,state.n-1)]:'시작은 가볍게, 확인은 꼼꼼하게!'}</p><div class="actions intro-actions"><button class="btn btn-secondary no-btn" id="no" data-action="no">싫어 ✕</button><button class="btn btn-primary yes-btn" id="yes" data-action="yes">좋아, 찾아볼래 →</button></div><p class="disclaimer">무료 · 회원가입 없음 · 2026년 10월 조사자료</p></section>`}
function celebrate(){return `<section class="scene scene-center"><div><div class="eyebrow">잘 선택하셨어요</div><h1 class="title">좋습니다.<br>이제 진짜<br><strong>내 돈 찾으러 갑니다!</strong></h1><p class="sub">딱 다섯 가지 질문만 할게요.<br>필요한 지원사업 후보를 보여드릴게요.</p></div><div class="celebrate-figure">${pose('celebrate')}</div><div class="main-below"><div class="happy-chips"><span class="happy-chip">🔎 쉽고 빠르게</span><span class="happy-chip">🔒 개인정보 입력 없이</span><span class="happy-chip">📎 공식 안내 링크</span></div><div style="height:25px"></div><button class="btn btn-primary wide" data-action="begin">계속하기 →</button></div></section>`}
function progress(){return `<div class="step-header"><button class="back" data-action="back" aria-label="이전으로">‹</button><span class="step-count">의정이의 질문 ${state.step+1} / 5</span></div><div class="progress">${[0,1,2,3,4].map(i=>`<i class="${i<=state.step?'active':''}"></i>`).join('')}</div>`}
function tile(v,chosen=false,wide=false){return `<button class="tile ${chosen?'chosen':''} ${wide?'wide':''}" data-action="choose" data-value="${esc(v)}" aria-pressed="${!!chosen}">${EMOJIS[v]?`<span class="em">${EMOJIS[v]}</span>`:''}${esc(v)}${chosen?' ✓':''}</button>`}
function checkTile(v,arr){return `<button class="tile ${arr.includes(v)?'chosen':''}" data-action="choose" data-value="${esc(v)}" aria-pressed="${arr.includes(v)}">${esc(v)}${arr.includes(v)?' ✓':''}</button>`}
function question(){const titles=['몇 살이세요?','어디에 사세요?','요즘 뭐 하고 계세요?','어떤 상황인가요?','무슨 혜택이 궁금해요?'];const desc=['연령에 따라 대상이 달라져요. 만 나이를 알려주세요.','우리 동네 지원사업은 거주지가 중요해요.','여러 개 선택해도 괜찮습니다.','주거 형태와 가족·생활 상황도 알려주세요.','관심 있는 분야를 하나 골라주세요.'];const bubbles=['나이에 따라<br>지원금이<br>달라져요!','의정부 사람이면<br>의정부 혜택부터!','일하는 중이어도<br>받을 혜택이<br>있을 수 있어요.','상황에 따라<br>더 잘 찾아볼게요!','이제 거의<br>다 찾았어요!'];const selectedPose=['thumb','point','neutral','surprise','phone'][state.step];let content='';if(state.step===0){content=`<label class="fieldlabel" for="age">만 나이</label><div class="age-box"><input id="age" type="number" min="0" max="110" inputmode="numeric" placeholder="예: 24" value="${esc(state.age)}" aria-label="만 나이"><small>세</small></div><div class="age-pills">${[18,24,29,39,65,70].map(a=>`<button data-action="agePick" data-value="${a}">${a}세</button>`).join('')}</div>`}else if(state.step===1){content=`<div class="tilegrid">${['의정부시','경기도 다른 시·군','경기도 외 지역'].map(v=>tile(v,state.region===v,v==='경기도 외 지역')).join('')}</div>`}else if(state.step===2){content=`<div class="section-cap">현재 상황 (복수 선택)</div><div class="tilegrid">${JOBS.map(v=>checkTile(v,state.jobs)).join('')}</div>`}else if(state.step===3){content=`<div class="section-cap">주거 형태</div><div class="tilegrid">${['월세','전세','자가·가족집','잘 모르겠어요'].map(v=>tile(v,state.housing===v)).join('')}</div><div class="section-cap">추가 상황 (있다면 복수 선택)</div><div class="tilegrid">${LIVES.map(v=>checkTile(v,state.lives)).join('')}</div>`}else{content=`<div class="tilegrid">${INTERESTS.map(v=>tile(v,state.interest===v)).join('')}</div>`}const nextText=state.step===4?'내 지원사업 후보 찾아보기 →':'다음 질문 →';return `<section class="scene question-wrap">${progress()}<div class="question-head"><div class="eyebrow">${state.step===0?'자, 시작해볼까요?':'의정이가 열심히 찾고 있어요'}</div><h1 class="question-title">${titles[state.step]}</h1><div class="sub">${desc[state.step]}</div></div><div class="question-art">${pose(selectedPose)}<div class="question-bubble">${bubbles[state.step]}</div></div><div class="question-main">${content}</div>${state.step===4?`<label class="analytics-consent" for="usageConsent"><input type="checkbox" id="usageConsent" ${state.analyticsConsent?'checked':''}><span><strong>내 검색 조건을 익명 통계로 제공하는 데 동의합니다. (선택)</strong><small>동의한 경우에만 만 나이·거주지·직업·주거·관심분야·추천사업을 기록합니다. 이름·연락처·IP 주소를 따로 수집하지 않으며 장애·저소득 관련 선택은 기록하지 않습니다.</small><small class="more-info">동의하지 않아도 지원금 결과를 정상적으로 볼 수 있어요.</small></span></label>`:''}${state.step<4?`<div class="next-hint"><span class="em">${['📍','💼','🏡','🎁'][state.step]}</span><div><b>다음엔 이런 것도 물어볼게요!</b><small>${['어디에 사세요?','요즘 뭐 하고 계세요?','어떤 상황인가요?','무슨 혜택이 궁금해요?'][state.step]}</small></div></div>`:''}<div class="bottom-fixed"><button class="btn btn-primary wide" data-action="next">${nextText}</button><p class="disclaimer">이름·전화번호·주민등록번호를 묻지 않아요.</p></div></section>`}
function ageCheck(b){
 const s=(b.target||'').replace(/∼|～|–|—/g,'~');
 if(/^(출산·양육|임신·출산|학생·청소년|한부모·가족)/.test(b.category)&&!/(청소년부모|부모 모두|청년부부)/.test(s))return 'child-or-family';
 const age=Number(state.age);let m=s.match(/(?:만\s*)?(\d{1,2})\s*[~\-]\s*(\d{1,2})\s*세/);
 if(m){let a=+m[1],c=+m[2];if(a<=c&&c<=110)return age>=a&&age<=c?'matched':'mismatch';}
 m=s.match(/(?:만\s*)?(\d{1,2})\s*세\s*이상/);if(m)return age>=+m[1]?'matched':'mismatch';
 m=s.match(/(?:만\s*)?(\d{1,2})\s*세\s*이하/);if(m)return age<=+m[1]?'matched':'mismatch';
 m=s.match(/만\s*(\d{1,2})\s*세(?!\s*[~\-])/);if(m){return age===+m[1]?'matched':'mismatch'}
 return 'unknown';
}
const jobRules={
'취업 준비 중':/취업|미취업|구직|면접|일자리|구인|채용|취약계층 맞춤형/,
'직장인':/근로|노동자|재직|중소기업|직장|복지포인트|4대보험|정규직/,
'학생':/학생|대학|학자금|청소년|교육|장학|학습|교재|자격시험/,
'자영업·창업':/소상공인|사업자|기업|자영업|창업|창작활동비|사업경영/,
'육아·가사':/아이|돌봄|육아|출산|양육|어린이|아동|부모|임신|신생아|보육/,
'은퇴·시니어':/노인|어르신|시니어|연금|장년|고령|경로/,
'기타':/복지|상담|서비스|주거|금융/
};
const liveRules={
'임신·출산 준비':/임신|출산|산모|난임|태아|신생아|첫만남|산후/,
'아이 양육 중':/아이|양육|육아|보육|가족|아동|어린이|학생|청소년|부모|교육|도서관/,
'신혼부부':/신혼|결혼|혼인|부부|주거|출산/,
'한부모가족':/한부모|가족|양육|부모/,
'장애 관련':/장애|재활|활동지원|보조기기/,
'저소득·생활지원':/저소득|기초생활|차상위|취약|생계|식품|생활장학|긴급/,
'군 복무 중':/군복무|군인|군복무|상해보험|군 복무/
};
function fitsInterest(b){const k=state.interest,s=[b.name,b.category,b.target,b.benefit_type].join(' ');switch(k){
case '전체':return true;case '현금·지역화폐':return /현금|지역화폐|수당|장려금|지원금|복지포인트|실비|환급/.test(s);
case '취업·청년':return /청년|취업|일자리|고용|노동|면접|근로/.test(s);
case '주거':return /월세|전세|이사|주거|임대|보증금|주택/.test(s);
case '학생·교육':return /학생|청소년|학자금|교육|장학|학습|학교/.test(s);
case '출산·육아':return /임신|출산|양육|아동|아이|부모|보육|산후|영유아|육아/.test(s);
case '어르신·복지':return /어르신|노인|시니어|장애|저소득|취약|기초생활|돌봄|연금/.test(s);
case '소상공인':return /소상공인|자영업|창업|중소기업|기업|사업자/.test(s);default:return true}}
function regionFits(b){return state.region==='의정부시'?true:state.region==='경기도 다른 시·군'?b.scope!=='의정부시':b.scope.startsWith('전국공통')}
function rankBenefits(){return BENEFITS.filter(regionFits).map(b=>{
 const ageResult=ageCheck(b);
 const text=[b.category,b.name,b.target,b.qualifications,b.benefit].join(' ');
 let score=ageResult==='matched'?26:ageResult==='mismatch'?-85:3;
 if((state.jobs||[]).some(j=>jobRules[j]?.test(text)))score+=34;
 if((state.lives||[]).some(j=>liveRules[j]?.test(text)))score+=36;
 if(state.housing==='월세'&&/월세|주거|임대|이사비/.test(text))score+=27;
 if(state.housing==='전세'&&/전세|주거|임대|보증/.test(text))score+=23;
 if(state.region==='의정부시'&&b.scope==='의정부시')score+=16;
 if(fitsInterest(b))score+=state.interest==='전체'?0:37;else if(state.interest!=='전체')score-=31;
 if(b.status.includes('마감'))score-=12;
 if(/대상자|해당|저소득|신청/.test(b.qualifications))score+=3;
 return {...b,_age:ageResult,_score:score,_interest:fitsInterest(b)};
 }).sort((a,b)=>b._score-a._score||Number(a.id)-Number(b.id))}
function recommendationList(){return rankBenefits().filter(b=>b._age!=='mismatch'&&(state.interest==='전체'||b._interest)&&(b._score>=15))}
function browseList(){return rankBenefits()}

function status(b){const s=b.status||'';if(/마감|종료/.test(s))return ['closed','접수 마감·확인'];if(/예정/.test(s))return ['wait','예정·추가 확인'];return ['wait','접수 여부 확인']}
function allowUrl(u){try{const uo=new URL(u);return uo.protocol==='https:' && (/\.go\.kr$/.test(uo.hostname)||uo.hostname==='go.kr')}catch{return false}}
function currentRows(){const rows=state.tab==='suggested'?recommendationList():browseList();return rows.filter(b=>!state.query.trim()||[b.name,b.benefit,b.target,b.category,b.agency,b.qualifications].join(' ').toLowerCase().includes(state.query.trim().toLowerCase()))}
function makeCard(b){const st=status(b);return `<article class="benefit"><div class="card-top"><div class="tags"><span class="tag">${esc(b.category)}</span><span class="tag">${esc(b.scope)}</span></div><span class="status ${st[0]}">${st[1]}</span></div><h3>${esc(b.name)}</h3><p class="amount">${esc(b.benefit)}</p><p class="details-short"><b>대상</b> ${esc(b.target)}</p><div class="card-foot"><button class="outline-light" data-action="detail" data-value="${esc(b.id)}" aria-expanded="false">추가 조건 보기 ＋</button>${allowUrl(b.url)?`<a href="${esc(b.url)}" class="official" target="_blank" rel="noopener noreferrer">공식 안내 ↗</a>`:`<span class="official disabled">링크 확인 필요</span>`}</div><div class="expand" id="d-${esc(b.id)}"><p><b>추가 조건</b> ${esc(b.qualifications||'공식 공고 확인')}</p><p><b>신청 시기</b> ${esc(b.period||'공식 공고 확인')}</p><p><b>자료상 상태</b> ${esc(b.status||'확인 필요')}</p><p><b>신청 방법</b> ${esc(b.method||'공식 안내 확인')}</p><p><b>기관</b> ${esc(b.agency||'공식 안내 확인')}</p>${b.notes?`<p><b>유의사항</b> ${esc(b.notes)}</p>`:''}<p><b>자료 확인일</b> ${esc(b.checked||DATA_DATE)}</p></div></article>`}
function cardsHtml(){const arr=currentRows();return `<p class="count-text">${state.tab==='suggested'?'우선 확인 후보':'전체 지역별 사업'} <b>${arr.length}개</b> · ${Math.min(arr.length,state.limit)}개 표시</p>${arr.length?`<div class="cards">${arr.slice(0,state.limit).map(makeCard).join('')}</div>`:'<div class="empty">해당 조건으로 찾은 사업이 없어요.<br>검색어를 지우거나 전체 목록을 살펴보세요.</div>'}${arr.length>state.limit?`<button class="more" data-action="more">10개 더 보기 (${arr.length-state.limit}개 남음) ↓</button>`:''}`}
function results(){const matched=recommendationList().length;return `<section class="scene results-head"><div class="eyebrow">의정이의 맞춤 탐색 결과</div><h1 class="results-title">확인해 볼 만한<br><span class="hilite">지원사업이에요.</span></h1><p class="sub">선택한 조건과 관련된 지원사업부터 보여드릴게요.</p><div class="hero-result">${pose('phone','small')}<div><div class="eyebrow">우선 확인할 후보</div><div class="count">${matched}<small>개 항목</small></div><div class="tiny">만 ${esc(state.age)}세 · ${esc(state.region)}<br>총 조사 항목 ${BENEFITS.length}개</div></div></div><div class="warn"><strong>반드시 읽어주세요!</strong> 이 목록은 공식 안내문을 바탕으로 추린 <b>관련 후보</b>입니다. <b>선정·신청 자격 확정이 아니고</b> 실시간 접수 현황도 아닙니다. 소득·가구·거주기간·연령 계산·사업기간 등을 공식 공고에서 재확인하세요. 서로 다른 지원금액을 합산하지 않습니다.</div><input class="find" id="search" type="search" placeholder="사업명·월세·장학금·출산 등 검색" value="${esc(state.query)}" aria-label="지원사업 검색"><div class="tabs"><button class="tab ${state.tab==='suggested'?'active':''}" data-action="tab" data-value="suggested">✨ 맞춤 후보</button><button class="tab ${state.tab==='all'?'active':''}" data-action="tab" data-value="all">📚 전체 보기</button></div><div id="cards">${cardsHtml()}</div><section class="export"><h3>내 검색 결과 저장하기</h3><p>현재 선택한 탭·검색어 기준으로 내보냅니다.</p><div class="export-grid"><button class="export-btn pdf" data-action="pdf">PDF로 저장</button><button class="export-btn png" data-action="png">이미지 저장</button><button class="export-btn csv" data-action="csv">CSV 내려받기</button><button class="export-btn share" data-action="share">링크 공유</button></div><div class="export-caption">PDF는 인쇄창에서 ‘PDF로 저장’을 선택하세요. PNG는 상위 최대 12개, CSV·PDF는 현재 결과 전체를 담습니다. 링크 공유는 웹 배포 후 이용하세요.</div></section><button class="restart" data-action="restart">↺ 처음부터 다시 찾기</button><p class="disclaimer">출처: 2026.10.22 공식 사이트 자료 조사 엑셀 · 세부 지원항목 포함 120개<br>최신 모집정보는 공식 공고를 확인해주세요.</p></section>`}
function render(){screen.innerHTML=state.page==='intro'?intro():state.page==='celebrate'?celebrate():state.page==='question'?question():results();topPage()}
function updateIntro(){render()}
function choose(v){if(state.step===1)state.region=v;else if(state.step===2)state.jobs=state.jobs.includes(v)?state.jobs.filter(x=>x!==v):[...state.jobs,v];else if(state.step===3){if(['월세','전세','자가·가족집','잘 모르겠어요'].includes(v))state.housing=v;else state.lives=state.lives.includes(v)?state.lives.filter(x=>x!==v):[...state.lives,v]}else if(state.step===4)state.interest=v;render()}

function newCompletionId(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 's'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14);
}
function completedSearchPayload(){
  const chosen=recommendationList();
  return {
    schemaVersion:1, event:'search_completed', eventId:state.completionEventId,
    consent:true, finishedAt:new Date().toISOString(),
    age:Number(state.age), region:state.region,
    jobs:state.jobs.slice(0,8),housing:state.housing,
    lives:state.lives.filter(v=>!LOG_EXCLUDED_LIVES.has(v)).slice(0,8),
    interest:state.interest,
    matchedCount:chosen.length,
    matchedIds:chosen.map(b=>Number(b.id)).slice(0,120),
    matchedNames:chosen.slice(0,20).map(b=>b.name),
    dataAsOf:DATA_DATE,
    totalItems:BENEFITS.length
  };
}
function recordCompletedSearch(){
  if(!state.analyticsConsent) return;
  if(!SHEETS_CONNECTED){state.analyticsStatus='unconfigured';return;}
  // Called only by completing all five questions, not by opening a shared results link.
  const body=JSON.stringify(completedSearchPayload());
  state.analyticsStatus='requested';
  try{
    fetch(SHEETS_ENDPOINT,{
      method:'POST',mode:'no-cors',cache:'no-store',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true
    }).catch((err)=>{state.analyticsStatus='failed';console.warn('익명 완료 기록 요청 실패',err);});
  }catch(err){state.analyticsStatus='failed';}
}
function next(){if(state.step===0){const v=document.getElementById('age').value.trim();if(!/^\d{1,3}$/.test(v)||+v>110){notify('만 나이를 0~110 사이로 입력해 주세요.');document.getElementById('age').focus();return}state.age=String(+v)}if(state.step===4){state.page='results';state.tab='suggested';state.limit=10;state.query='';state.completionEventId=newCompletionId();recordCompletedSearch();render()}else{state.step++;render()}}
function safeCSV(v){let s=String(v==null?'':v).replace(/\r?\n/g,' ');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function dl(blob,filename){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),7000)}
function rowsCSV(){const cols=[['사업명','name'],['분야','category'],['지역','scope'],['지원유형','benefit_type'],['지원내용','benefit'],['대상','target'],['추가 자격','qualifications'],['신청 시기','period'],['자료상 상태','status'],['운영기관','agency'],['공식링크','url'],['조사일','checked']];const rows=currentRows();const lines=[cols.map(c=>safeCSV(c[0])).join(','),...rows.map(r=>cols.map(c=>safeCSV(r[c[1]])).join(','))];return '\ufeff'+lines.join('\r\n')}
function doCSV(){dl(new Blob([rowsCSV()],{type:'text/csv;charset=utf-8'}),`의정부툰_지원사업_검색결과_${DATA_DATE}.csv`);notify('CSV 다운로드를 시작했어요.')}
function printPDF(){const rows=currentRows(),r=document.getElementById('printReport');r.innerHTML=`<h1>의정부툰 | 지원사업 검색 결과</h1><div class="print-sub">만 ${esc(state.age)}세 · ${esc(state.region)} · ${esc(state.interest)} / ${rows.length}개 세부 항목 / 공식자료 조사일 ${DATA_DATE}</div><div class="print-notice">이 문서는 자격 승인 증명서가 아닙니다. 접수기간·거주기간·소득·가구·중복지원 등 공식 안내를 확인하세요. 2026.10.22 자료이며 실시간 업데이트되지 않습니다.</div>${rows.map(b=>`<article class="print-card"><h3>${esc(b.name)}</h3><p><strong>지원 내용</strong> ${esc(b.benefit)}</p><p><strong>대상</strong> ${esc(b.target)}</p><p><strong>추가 조건</strong> ${esc(b.qualifications)}</p><p><strong>신청 기간</strong> ${esc(b.period)}</p><p><strong>상태</strong> ${esc(b.status)}</p><p><strong>공식 URL</strong> ${esc(b.url)}</p></article>`).join('')}`;window.print();notify('인쇄창에서 “PDF로 저장”을 선택해 주세요.')}
function clipText(ctx,str,maxW){let s=String(str||'');const lines=[],parts=Array.from(s);let cur='';for(const ch of parts){if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch}if(cur)lines.push(cur);return lines}
function png(){const rows=currentRows().slice(0,12),w=920,pad=60;const cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');if(!ctx){notify('이 브라우저에서는 이미지 저장이 어렵습니다.');return}let layout=[];ctx.font='28px sans-serif';for(const b of rows){let h=168;h+=Math.min(3,clipText(ctx,b.target,760).length)*37;h+=Math.min(3,clipText(ctx,b.benefit,760).length)*37;layout.push(h)}const h=290+layout.reduce((a,b)=>a+b+18,0)+130;cvs.width=w;cvs.height=Math.min(h,18000);ctx.fillStyle='#f2f8fc';ctx.fillRect(0,0,w,h);ctx.fillStyle='#082f54';ctx.fillRect(0,0,w,254);ctx.textBaseline='top';ctx.fillStyle='#ffd447';ctx.font='bold 23px sans-serif';ctx.fillText('의정부툰  ·  지원금 탐색기',pad,41);ctx.fillStyle='#ffffff';ctx.font='bold 45px sans-serif';ctx.fillText('나의 지원사업 찾기 결과',pad,92);ctx.font='21px sans-serif';ctx.fillStyle='#cce7f8';ctx.fillText(`만 ${state.age}세 · ${state.region} · ${state.interest}`,pad,169);ctx.fillText(`${DATA_DATE} 공식자료 조사본  |  전체 ${currentRows().length}개 중 최대 12개 표시`,pad,206);let y=282;function line(t,x,yy,sz,col='') {ctx.font=`${sz}px sans-serif`;ctx.fillStyle=col||'#173850';ctx.fillText(t,x,yy)};for(let i=0;i<rows.length;i++){const b=rows[i],bh=layout[i];ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(pad,y,w-2*pad,bh,18);ctx.fill();ctx.strokeStyle='#dae6ef';ctx.stroke();line(`${i+1}. ${b.name}`,pad+22,y+19,27,'#163a52');let ty=y+63;ctx.font='23px sans-serif';for(const t of clipText(ctx,b.benefit,740).slice(0,3)){line(t,pad+22,ty,23,'#146ca3');ty+=36}ctx.font='20px sans-serif';for(const t of clipText(ctx,'대상: '+b.target,745).slice(0,3)){line(t,pad+22,ty+6,20,'#526779');ty+=32}line(`상태: ${b.status}`,pad+22,y+bh-37,18,'#647e91');y+=bh+18}line('※ 조건에 맞을 가능성이 있는 사업이며 신청 자격·접수중 여부는 공식 공고로 확인하세요.',pad,y+28,19,'#526779');line('※ 공식 안내 URL 등 상세 내용은 PDF 또는 CSV로 저장해 확인하세요.',pad,y+59,18,'#526779');cvs.toBlob(blob=>{if(blob){dl(blob,`의정부툰_지원금결과_${DATA_DATE}.png`);notify('결과 이미지를 저장했어요.')}else notify('이미지 저장에 실패했어요.')},'image/png')}
function sharePayload(){return {age:state.age,region:state.region,jobs:state.jobs,housing:state.housing,lives:state.lives,interest:state.interest,tab:state.tab,query:state.query}}
function shareLink(){if(location.protocol==='file:'){notify('GitHub Pages에 게시한 뒤 공유 링크를 사용할 수 있어요.');return}const u=new URL(location.href);u.hash='r='+encodeURIComponent(JSON.stringify(sharePayload()));const shareUrl=u.toString();if(navigator.share){navigator.share({title:'의정부툰 내 지원금 찾기',text:'의정이랑 내 지원사업 후보를 확인해보세요. 결과는 참고용입니다.',url:shareUrl}).catch(()=>copyURL(shareUrl))}else copyURL(shareUrl)}
function copyURL(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>notify('결과 링크를 복사했어요!')).catch(()=>legacyCopy(s))}else legacyCopy(s)}
function legacyCopy(s){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy');notify('링크를 복사했어요!')}catch{notify('주소창의 링크를 복사해 주세요.')}t.remove()}
function loadShared(){if(!location.hash.startsWith('#r='))return;try{const x=JSON.parse(decodeURIComponent(location.hash.slice(3)));if(!/^\d{1,3}$/.test(String(x.age))||Number(x.age)>110)return;state.age=String(Number(x.age));state.region=['의정부시','경기도 다른 시·군','경기도 외 지역'].includes(x.region)?x.region:'의정부시';state.jobs=Array.isArray(x.jobs)?x.jobs.filter(v=>JOBS.includes(v)):[];state.housing=['월세','전세','자가·가족집','잘 모르겠어요'].includes(x.housing)?x.housing:'잘 모르겠어요';state.lives=Array.isArray(x.lives)?x.lives.filter(v=>LIVES.includes(v)):[];state.interest=INTERESTS.includes(x.interest)?x.interest:'전체';state.tab=x.tab==='all'?'all':'suggested';state.query=typeof x.query==='string'?x.query.slice(0,80):'';state.page='results';state.step=4}catch(e){}}
screen.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value||'';if(a==='no'){state.n=Math.min(5,state.n+1);if(state.n>=5){document.body.insertAdjacentHTML('beforeend',`<button class="takeover" id="takeover" data-action="yes">${pose('celebrate')}좋아! 😎<span style="font-size:16px">이젠 지원금 찾으러 가야죠 →</span></button>`)}else updateIntro()}else if(a==='yes'){document.getElementById('takeover')?.remove();state.page='celebrate';render()}else if(a==='begin'){state.page='question';state.step=0;render()}else if(a==='agePick'){state.age=v;const inp=document.getElementById('age');if(inp){inp.value=v;inp.focus()}}else if(a==='choose')choose(v);else if(a==='next')next();else if(a==='back'){if(state.step===0){state.page='celebrate'}else state.step--;render()}else if(a==='tab'){state.tab=v;state.limit=10;render()}else if(a==='more'){state.limit+=10;document.getElementById('cards').innerHTML=cardsHtml()}else if(a==='detail'){const d=document.getElementById('d-'+v);if(d){const yes=d.classList.toggle('open');el.textContent=yes?'조건 접기 −':'추가 조건 보기 ＋';el.setAttribute('aria-expanded',String(yes))}}else if(a==='restart'){Object.assign(state,{page:'intro',n:0,step:0,age:'',region:'의정부시',jobs:[],housing:'잘 모르겠어요',lives:[],interest:'전체',tab:'suggested',query:'',limit:10,analyticsConsent:false,completionEventId:'',analyticsStatus:'not_requested'});try{if(location.protocol==='https:'||location.protocol==='http:')history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}else if(a==='csv')doCSV();else if(a==='pdf')printPDF();else if(a==='png')png();else if(a==='share')shareLink()});
document.body.addEventListener('click',e=>{if(e.target.closest('#takeover')){document.getElementById('takeover')?.remove();state.page='celebrate';render()}});
screen.addEventListener('change',e=>{if(e.target.id==='usageConsent'){state.analyticsConsent=Boolean(e.target.checked);}});
screen.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;state.limit=10;document.getElementById('cards').innerHTML=cardsHtml()}else if(e.target.id==='age'){state.age=e.target.value}});
document.getElementById('home').addEventListener('click',()=>{document.getElementById('takeover')?.remove();state.page='intro';state.n=0;render()});
loadShared();render();

/* V4 광고 팝업: 1) LocalVision 전화 연결 → 2) 샛별플라워 네이버 지도 */
(function () {
  'use strict';
  const DAY = 24 * 60 * 60 * 1000;
  const STORAGE_PREFIX = 'uijeongbu-toon-ad-hide-until-v4:';
  const ads = [
    {
      id:'localvision', name:'로컬비전', image:'popup-localvision.webp',
      url:'tel:01083518719', newTab:false,
      accessible:'로컬비전 광고 문의 전화 010-8351-8719 연결'
    },
    {
      id:'saetbyeol', name:'샛별플라워', image:'popup-saetbyeol.png',
      url:'https://map.naver.com/p/entry/place/1575249700?placePath=%2Fhome', newTab:true,
      accessible:'샛별플라워 네이버 지도 매장 페이지 열기'
    }
  ];
  let at = -1;
  let priorFocus = null;
  const overlay = document.createElement('div');
  overlay.className = 'ad-overlay';
  overlay.id = 'adOverlay';
  overlay.hidden = true;
  overlay.setAttribute('aria-hidden','true');
  overlay.innerHTML = `
    <section class="ad-window" role="dialog" aria-modal="true" aria-labelledby="adDialogTitle">
      <div class="ad-heading">
        <span class="ad-count" id="adDialogTitle">광고 · 1 / 2</span>
        <button type="button" class="ad-x" id="adClose" aria-label="현재 광고 닫고 다음으로">×</button>
      </div>
      <a id="adLink" class="ad-picture-link" href="#" aria-label="광고 상세로 이동">
        <img id="adPicture" class="ad-picture" alt="광고 이미지" width="1254" height="1254" decoding="async">
      </a>
      <div class="ad-bottom">
        <button type="button" id="adSnooze" class="ad-snooze">24시간 동안 보지 않기</button>
        <button type="button" id="adNext" class="ad-next">다음 광고 보기 →</button>
      </div>
    </section>`;
  document.body.appendChild(overlay);
  const dialog = overlay.querySelector('.ad-window');
  const img = overlay.querySelector('#adPicture');
  const link = overlay.querySelector('#adLink');
  const count = overlay.querySelector('#adDialogTitle');
  const next = overlay.querySelector('#adNext');
  const close = overlay.querySelector('#adClose');
  const snooze = overlay.querySelector('#adSnooze');

  function getHideUntil(id){
    try { return Number(localStorage.getItem(STORAGE_PREFIX+id)||'0') || 0; }
    catch(e){ return 0; }
  }
  function hideForDay(id){
    try {localStorage.setItem(STORAGE_PREFIX+id, String(Date.now()+DAY));}
    catch(e){ /* storage unavailable: close current ad for this visit */ }
  }
  function finish(){
    at=-1; overlay.hidden=true;overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('ad-modal-open');
    if(priorFocus && priorFocus.isConnected) priorFocus.focus({preventScroll:true});
  }
  function showNext(){
    for(let i=at+1; i<ads.length; i++){
      if(getHideUntil(ads[i].id)>Date.now())continue;
      at=i;
      const ad = ads[i];
      count.textContent=`광고 · ${i+1} / ${ads.length}  |  ${ad.name}`;
      img.src=ad.image;
      img.alt=`${ad.name} 홍보 이미지. 클릭하면 ${ad.accessible}`;
      link.href=ad.url;link.setAttribute('aria-label',ad.accessible);
      if(ad.newTab){link.target='_blank';link.rel='noopener noreferrer';}
      else{link.removeAttribute('target');link.removeAttribute('rel');}
      next.textContent=i<ads.length-1?'다음 광고 보기 →':'광고 닫기';
      close.setAttribute('aria-label',i<ads.length-1?'현재 광고 닫고 다음 광고 보기':'광고 닫기');
      overlay.hidden=false;overlay.setAttribute('aria-hidden','false');
      document.body.classList.add('ad-modal-open');
      close.focus({preventScroll:true});
      return;
    }
    finish();
  }
  close.addEventListener('click',showNext);
  next.addEventListener('click',showNext);
  snooze.addEventListener('click',()=>{if(at>=0)hideForDay(ads[at].id);showNext();});
  link.addEventListener('click',()=>{
    /* href의 tel: 및 새 탭 열기 기본 동작을 유지하면서 다음 광고 표시 */
    setTimeout(showNext, 120);
  });
  document.addEventListener('keydown',e=>{
    if(overlay.hidden)return;
    if(e.key==='Escape'){e.preventDefault();showNext();return;}
    if(e.key==='Tab'){
      const focusable=[close,link,snooze,next];
      const here=focusable.indexOf(document.activeElement);
      if(e.shiftKey && here<=0){e.preventDefault();next.focus();}
      else if(!e.shiftKey && here===focusable.length-1){e.preventDefault();close.focus();}
    }
  });
  window.addEventListener('load',()=>{
    priorFocus=document.activeElement;
    at=-1;showNext();
  },{once:true});
})();

</script>
